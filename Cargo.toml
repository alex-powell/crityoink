[package]
name = "crityoink"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Local High/Critical NVD mirror and offline CPE inventory checker"
repository = "https://github.com/alex-powell/crityoink"
readme = "README.md"
authors = ["Alex Powell"]
keywords = ["cve", "nvd", "cpe", "security", "cli"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "2.12"

[dev-dependencies]
tempfile = "3.14"
